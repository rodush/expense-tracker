<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Categorizer</title>
  <link rel="stylesheet" href="/static/pico/css/pico.green.min.css">
  <style type="text/css">
    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="panel">
      <h1>Expense Categorizer MVP</h1>
      <p>Upload a CSV, XLS, or XLSX expense file to categorize descriptions with Gemini.</p>
      <input id="fileInput" type="file" accept=".csv,.xls,.xlsx" aria-errormessage="error" />
      <button id="uploadButton">Upload & Categorize</button>
      <div id="loading" class="hidden">Processing...</div>
      <div id="error" class="error hidden"></div>
    </div>

    <div class="panel">
      <h2>Preview</h2>
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Who</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <a id="downloadLink" class="hidden">Download categorized file</a>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>

</html>
