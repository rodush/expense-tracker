<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expenses Categorizer</title>
  <link rel="stylesheet" href="/static/pico/css/pico.green.min.css">
  <link rel="icon" href="/static/images/favicon.ico" />
  <style type="text/css">
    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <header class="container">
    <nav>
      <ul>
        <li><img src="/static/images/expense-tracker-logo.png" width="100rem" preload="true" /></li>
        <li>
          <h1 style="display: inline-block;" class="inline">Expenses Categorizer - MVP</h1>
        </li>
      </ul>
      <ul>
        <li><a href="/about.html">About</a></li>
        <li><a href="/">Home</a></li>
      </ul>
    </nav>


  </header>
  <main class="container">
    <div class="panel">
      <p>Upload a CSV, XLS, or XLSX expense file to categorize descriptions with Gemini.</p>
      <input id="fileInput" type="file" accept=".csv,.xls,.xlsx" aria-errormessage="error" />
      <button id="uploadButton">Upload & Categorize</button>
      <div id="loading" class="hidden">Processing...</div>
      <div id="error" class="error hidden"></div>
    </div>

    <article>
      <h2>Preview</h2>
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Who</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <a id="downloadLink" class="hidden">Download categorized file</a>
    </article>
  </main>
  <footer class="container"><em>Experimenting with Python and FastAPI &dash; &copy; 2026</em></footer>
  <script src="/static/app.js"></script>
</body>

</html>
