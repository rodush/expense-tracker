[project]
name = "expense-categorizer"
version = "0.1.0"
description = "Categorises expenses in the uploaded XLS file using Gemini AI"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.115.0",
    "google-generativeai==0.8.3",
    "httpx==0.27.2",
    "jinja2==3.1.6",
    "pandas>=3.0.5",
    "pytest==8.3.3",
    "python-dotenv>=1.2.2",
    "python-multipart==0.0.9",
    "uvicorn==0.30.6",
    "xlrd==2.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
