repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ty
        name: Ty
        entry: uv run ty check
        language: system
        types: [python]

      - id: trufflehog-staged
        name: TruffleHog Git Staged Scanner
        entry: trufflehog git file://. --results=verified
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: trufflehog-files
        name: TruffleHog Workspace Scanner
        entry: trufflehog filesystem . --exclude-paths=.trufflehogignore --only-verified --fail
        language: system
        stages:
          - pre-commit

      - id: trufflehog
        name: TruffleHog Git PrePush Scanner
        entry: trufflehog git file://.
        language: system
        pass_filenames: false
        stages:
          - pre-push
   